name: Travel rules
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rules:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate travel rules
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Validate Chinese menu display rules
        shell: pwsh
        run: ./menu-chinese/scripts/test.ps1
      - name: Validate automatic collection rules
        shell: pwsh
        run: ./auto-collect/scripts/test.ps1
